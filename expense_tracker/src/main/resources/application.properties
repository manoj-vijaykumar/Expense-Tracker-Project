
spring.application.name=expense_tracker

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-super-frog-zaiapiwo-pooler.c-2.eu-west-2.aws.neon.tech/neondb?sslmode=require&channelBinding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Cassandra
# spring.cassandra.contact-points=${CASSANDRA_CONTACT_POINTS:localhost:9042}
